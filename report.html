<script>
(function(){
  var el = document.getElementById('splash'), H = document.documentElement;
  if (!el) return;
  if (H.classList.contains('no-splash')){ el.remove(); return; }
  try { sessionStorage.setItem('pz_splash', '1'); } catch(e){}
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  H.classList.add('splashing'); el.classList.add('play');
  var t = document.getElementById('spType'), word = 'Project Zone', i = 0, z = null;
  function type(){
    if (i >= word.length){ el.classList.add('typed'); return; }
    var c = word.charAt(i++);
    if (i === 9){ z = document.createElement('span'); z.className = 'z'; t.appendChild(z); }
    (z || t).appendChild(document.createTextNode(c));
    setTimeout(type, c === ' ' ? 120 : 55 + Math.random() * 45);
  }
  setTimeout(type, reduce ? 0 : 480);
  var done = false;
  function end(){
    if (done) return; done = true;
    el.classList.add('out'); H.classList.remove('splashing');
    setTimeout(function(){ el.remove(); }, 800);
  }
  setTimeout(end, reduce ? 700 : 2400);
  el.addEventListener('click', end);
})();
</script>

<div class="toast" id="toast"></div>

<script>
(() => {
  const CFG = window.APP_CONFIG || {};
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const today = () => ymd(new Date());

  let date = new URLSearchParams(location.search).get('date') || today();
  let filter = 'all', data = { stores: [], rows: [], form: { jobName: '', fields: [] } }, model = [], loading = false;
  const jobName = () => data.form.jobName || '';
  function paintJob(){
    $('jobTitle').textContent = jobName(); $('jobTitle').hidden = !jobName();
    $('jobSmall').textContent = jobName();
    document.title = 'รายงาน ' + jobName() + ' · Project Zone';
  }

  let toastT;
  function toast(msg, err){
    const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400);
  }

  /* ---------- Date ---------- */
  function paintDate(){
    const d = new Date(date + 'T00:00:00');
    $('dTxt').textContent = d.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    const diff = Math.round((new Date(today() + 'T00:00:00') - d) / 864e5);
    $('dSub').textContent = diff === 0 ? 'วันนี้' : diff === 1 ? 'เมื่อวาน' : diff + ' วันก่อน';
    $('dIn').value = date; $('dIn').max = today();
    $('next').disabled = date >= today();
  }
  function shift(n){
    const d = new Date(date + 'T00:00:00'); d.setDate(d.getDate() + n);
    date = ymd(d); paintDate(); load();
  }
  $('prev').onclick = () => shift(-1);
  $('next').onclick = () => shift(1);
  $('dIn').onchange = e => { if (e.target.value){ date = e.target.value; paintDate(); load(); } };
  $('dIn').onclick = e => { try { e.target.showPicker(); } catch(err){} };

  /* ---------- Load ---------- */
  async function load(){
    if (loading) return; loading = true;
    $('refresh').classList.add('spinning');
    if (!model.length) $('list').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    try {
      const r = await fetch(`${CFG.API_URL}?action=report&date=${date}`);
      const j = await r.json();
      if (!j.ok) throw new Error(j.error);
      data = j; paintJob(); build(); render();
      $('updated').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
    } catch(e){
      toast('โหลดข้อมูลไม่สำเร็จ', true);
      if (!model.length) $('list').innerHTML = '<div class="empty">โหลดข้อมูลไม่สำเร็จ แตะปุ่มรีเฟรชเพื่อลองใหม่</div>';
    } finally {
      loading = false; $('refresh').classList.remove('spinning');
    }
  }

  function build(){
    const by = {};
    data.rows.forEach(r => (by[r.storeId] = by[r.storeId] || []).push(r));
    model = data.stores.map(s => ({ ...s, subs: (by[s.id] || []).sort((a, b) => b.ts - a.ts) }));
    Object.keys(by).forEach(id => {
      if (!model.some(s => s.id === id)) model.push({ id, name: '(ไม่อยู่ใน DATA STORE)', subs: by[id] });
    });
  }

  /* ---------- Render ---------- */
  function render(){
    const total = model.length, sent = model.filter(s => s.subs.length).length;
    const p = total ? sent / total : 0;
    $('ringBar').style.strokeDashoffset = 376.99 * (1 - p);
    $('ringBar').style.stroke = p >= 1 ? 'var(--green)' : 'var(--y)';
    $('pct').textContent = Math.round(p * 100) + '%';
    $('sentN').textContent = sent; $('totalN').textContent = total;
    $('subN').textContent = data.rows.length + ' รายการที่ส่ง';
    $('sOk').textContent = sent; $('sNo').textContent = total - sent;

    const q = $('q').value.trim().toLowerCase();
    const shown = model.filter(s => {
      if (filter === 'sent' && !s.subs.length) return false;
      if (filter === 'no' && s.subs.length) return false;
      if (!q) return true;
      const hay = [s.id, s.name, ...s.subs.flatMap(x => Object.values(x.a || {}))].join(' ').toLowerCase();
      return hay.includes(q);
    });
    $('count').textContent = shown.length + ' สาขา';
    $('list').innerHTML = shown.length ? shown.map(card).join('') : '<div class="empty">ไม่มีรายการ</div>';
  }

  function card(s, i){
    const ok = s.subs.length > 0;
    return `<article class="rc ${ok ? 'ok' : 'no'}" style="--i:${i}">
      <div class="rhead">
        <div><div class="sid">${esc(s.id)}</div><div class="sname">${esc(s.name)}</div></div>
        <span class="pill ${ok ? 'pill-ok' : 'pill-no'}"><i></i>${ok ? 'ส่งแล้ว' + (s.subs.length > 1 ? ' ×' + s.subs.length : '') : 'ยังไม่ส่ง'}</span>
      </div>
      ${s.subs.map(sub).join('')}
    </article>`;
  }
  function sub(r){
    const F = data.form.fields;
    const info = F.filter(f => f.type !== 'store' && f.type !== 'files');
    const ups = F.filter(f => f.type === 'files');
    return `<div class="subm">
      <div class="meta">
        ${info.map(f => `<div><small>${esc(f.label)}</small><b>${esc((r.a || {})[f.id] || '—')}</b></div>`).join('')}
        <div><small>เวลา</small><b>${esc(r.time)} น.</b></div>
      </div>
      ${ups.map(f => { const L = (r.f || {})[f.id] || []; return `
      <div class="tl">${esc(f.label)} (${L.length})</div>
      <div class="strip">${L.map(thumb).join('') || '<span class="none">ไม่มีไฟล์</span>'}</div>`; }).join('')}
      ${r.folder ? `<a class="flink" href="${esc(r.folder)}" target="_blank" rel="noopener">📁 เปิดโฟลเดอร์</a>` : ''}
    </div>`;
  }
  function thumb(f){
    return `<button class="tb" type="button" data-id="${esc(f.id)}" data-url="${esc(f.url)}">
      <img loading="lazy" alt="" src="https://drive.google.com/thumbnail?id=${encodeURIComponent(f.id)}&sz=w200"
        onerror="this.parentNode.classList.add('err')"></button>`;
  }

  /* ---------- Filters / search ---------- */
  const segBtns = [...$('seg').querySelectorAll('button')];
  segBtns.forEach((b, i) => b.onclick = () => {
    filter = b.dataset.f;
    segBtns.forEach(x => x.classList.toggle('on', x === b));
    $('seg').querySelector('.knob').style.transform = `translateX(${i * 100}%)`;
    render();
  });
  let qT; $('q').oninput = () => { clearTimeout(qT); qT = setTimeout(render, 150); };
  $('refresh').onclick = load;

  /* ---------- Lightbox ---------- */
  $('list').addEventListener('click', e => {
    const t = e.target.closest('.tb'); if (!t) return;
    $('lbImg').src = `https://drive.google.com/thumbnail?id=${encodeURIComponent(t.dataset.id)}&sz=w2000`;
    $('lbOpen').href = t.dataset.url;
    $('lb').classList.add('show');
  });
  const closeLb = () => $('lb').classList.remove('show');
  $('lbX').onclick = closeLb;
  $('lb').addEventListener('click', e => { if (e.target.closest('.lb-img') && e.target.tagName !== 'IMG') closeLb(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

  /* ---------- Copy summary ---------- */
  $('copyBtn').onclick = async () => {
    const d = new Date(date + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
    const sent = model.filter(s => s.subs.length), no = model.filter(s => !s.subs.length);
    let txt = `📋 สรุปส่งงาน ${jobName()}\n🗓 ${d}\n✅ ส่งแล้ว ${sent.length}/${model.length} สาขา\n`;
    if (no.length) txt += `\n❌ ยังไม่ส่ง\n` + no.map(s => `• ${s.id} ${s.name}`).join('\n');
    else txt += `\n🎉 ส่งครบทุกสาขา`;
    try { await navigator.clipboard.writeText(txt); toast('คัดลอกแล้ว วางใน LINE ได้เลย'); }
    catch(e){ toast('คัดลอกไม่สำเร็จ', true); }
  };

  /* ---------- Auto refresh ---------- */
  setInterval(() => { if (!document.hidden && date === today()) load(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

  paintDate(); load();
})();
</script>
