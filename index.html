<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFD60A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ส่งงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div>
      <span class="tag"><i></i>SUBMIT · ส่งงานสาขา</span>
      <h1>ส่งงาน<span id="jobTitle" hidden></span></h1>
      <p class="desc" id="jobDesc"></p>
    </div>
    <div class="tools">
      <a class="pillbtn" href="report.html">📊 ดูรายงาน</a>
      <a class="round sm" href="admin.html" aria-label="ตั้งค่า" title="ตั้งค่า">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </a>
    </div>
  </header>

  <main class="form-grid" id="form">
    <section class="panel" id="pInfo"><div class="skel dark"></div><div class="skel dark"></div><div class="skel dark"></div></section>
  </main>
</div>

<!-- Wheel picker sheet -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog">
  <div id="sheetDrag">
    <div class="grab"></div>
    <div class="sheet-head">
      <button id="cancelSheet" type="button">ยกเลิก</button>
      <b id="sheetTitle">เลือก</b>
      <button id="doneSheet" class="done" type="button">เลือก</button>
    </div>
  </div>
  <div class="wheel-wrap"><div class="band"></div><div class="wheel" id="wheel"></div></div>
</div>

<div class="overlay" id="overlay"><div class="hud" id="hud"></div></div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const CFG = window.APP_CONFIG || {};
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ls = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  };
  const S = { form: null, stores: [], vals: {}, files: {} };
  const ICON = {
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    chev: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4.5l3 3 3-3"/></svg>'
  };

  /* ---------- Toast / haptic ---------- */
  let toastT;
  function toast(msg, err){
    const t = $('toast'); t.textContent = msg;
    t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
  }
  function haptic(){ try { navigator.vibrate && navigator.vibrate(8); } catch(e){} }
  function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

  /* ---------- Load ---------- */
  async function init(){
    const cf = ls.get('form'), cs = ls.get('stores');
    if (cf && cs){ S.form = cf; S.stores = cs; restore(); render(); }
    try {
      const r = await fetch(CFG.API_URL + '?action=init');
      const j = await r.json();
      if (!j.ok) throw new Error(j.error);
      const changed = JSON.stringify(j.form) !== JSON.stringify(S.form) || JSON.stringify(j.stores) !== JSON.stringify(S.stores);
      S.form = j.form; S.stores = j.stores;
      ls.set('form', j.form); ls.set('stores', j.stores);
      if (changed){ restore(); render(); }
    } catch(e){
      if (!S.form){
        $('form').innerHTML = '<section class="panel solo-msg"><h2>⚠️ โหลดฟอร์มไม่สำเร็จ</h2><p>ตรวจสอบอินเทอร์เน็ต แล้วดึงหน้าจอลงเพื่อโหลดใหม่</p></section>';
      }
    }
  }
  function restore(){
    S.form.fields.forEach(f => {
      if (f.type === 'files'){ S.files[f.id] = S.files[f.id] || []; return; }
      if (S.vals[f.id] == null && f.remember){
        const v = ls.get('rem_' + f.id);
        if (v != null) S.vals[f.id] = v;
      }
    });
    const st = S.form.fields.find(f => f.type === 'store');
    if (st && S.vals[st.id] && !S.stores.some(s => s.id === S.vals[st.id])) delete S.vals[st.id];
  }

  /* ---------- Render form ---------- */
  function render(){
    const F = S.form;
    $('jobTitle').hidden = !F.jobName;
    $('jobTitle').textContent = F.jobName;
    $('jobDesc').textContent = F.desc || '';
    document.title = 'ส่งงาน · ' + F.jobName;

    if (F.active === false){
      $('form').className = 'form-grid solo';
      $('form').innerHTML = `<section class="panel solo-msg" id="pInfo"><div class="big-ico">⏸️</div><h2>ปิดรับงานชั่วคราว</h2><p>งาน "${esc(F.jobName)}" ยังไม่เปิดรับ หรือปิดรับไปแล้ว</p></section>`;
      return;
    }
    const info = F.fields.filter(f => f.type !== 'files');
    const ups = F.fields.filter(f => f.type === 'files');
    $('form').className = 'form-grid' + (ups.length ? '' : ' solo');
    $('form').innerHTML =
      `<section class="panel" id="pInfo" style="--i:1">
        <div class="panel-h"><h2>🏬 ข้อมูลผู้ส่ง</h2><small><span class="req">*</span> จำเป็นต้องกรอก</small></div>
        ${info.map(fieldHtml).join('')}
      </section>` +
      (ups.length ? `<section class="panel" id="pUp" style="--i:2">${ups.map((f, i) =>
        (i ? '<div class="divider"></div>' : '') + upHtml(f)).join('')}</section>` : '') +
      `<button class="btn btn-dark" id="submitBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>ส่งงาน</button>`;
    ups.forEach(f => renderThumbs(f.id));
    $('submitBtn').onclick = submit;
  }
  const req = f => f.required ? '<span class="req">*</span>' : '';
  function fieldHtml(f){
    const v = S.vals[f.id] || '';
    if (f.type === 'store' || f.type === 'select'){
      let main = '', sub = '';
      if (f.type === 'store'){
        const s = S.stores.find(x => x.id === v);
        if (s){ main = esc(s.id); sub = esc(s.name); }
      } else if (v) main = esc(v);
      return `<button class="field pick" id="fld_${f.id}" data-pick="${f.id}" type="button">
        <span class="fl">${esc(f.label)}${req(f)}</span>
        <span class="fv">${main || `<em>${f.type === 'store' ? 'แตะเพื่อเลือกสาขา' : 'แตะเพื่อเลือก'}</em>`}</span>
        <span class="fs">${sub || esc(f.hint || '')}</span>
        <span class="chev">${ICON.chev}</span></button>`;
    }
    return `<label class="field" id="fld_${f.id}">
      <span class="fl">${esc(f.label)}${req(f)}${f.hint ? ` <span class="fh">· ${esc(f.hint)}</span>` : ''}</span>
      <input data-in="${f.id}" value="${esc(v)}" ${f.type === 'number' ? 'inputmode="numeric"' : ''} autocomplete="off" placeholder="${esc(f.placeholder || '')}">
    </label>`;
  }
  function upHtml(f){
    const n = (S.files[f.id] || []).length;
    return `<div class="panel-h"><h2>${f.multiple ? '📄' : '📷'} ${esc(f.label)}${req(f)}</h2><small id="cnt_${f.id}">${n ? n + ' ไฟล์' : esc(f.hint || '')}</small></div>
      <div class="up" id="fld_${f.id}">
        <div class="thumbs" id="th_${f.id}" data-th="${f.id}"></div>
        <button class="drop" data-up="${f.id}" type="button">
          <span class="di">${f.multiple ? ICON.plus : ICON.cam}</span>
          <span><b id="ub_${f.id}">เพิ่ม${esc(f.label)}</b><small>${f.multiple ? 'ถ่ายรูป · เลือกจากคลัง · หลายไฟล์ได้' : 'ถ่ายรูป · เลือกจากคลัง · 1 ไฟล์'}${f.pdf ? ' · PDF' : ''}</small></span>
        </button>
      </div>
      <input type="file" id="in_${f.id}" data-file="${f.id}" accept="image/*${f.pdf ? ',application/pdf' : ''}" ${f.multiple ? 'multiple' : ''} hidden>`;
  }

  /* ---------- Delegated events ---------- */
  const form = $('form');
  form.addEventListener('input', e => {
    const id = e.target.dataset.in; if (!id) return;
    S.vals[id] = e.target.value;
  });
  form.addEventListener('click', e => {
    const p = e.target.closest('[data-pick]');
    if (p) return openPick(p.dataset.pick);
    const u = e.target.closest('[data-up]');
    if (u) return $('in_' + u.dataset.up).click();
    const x = e.target.closest('.thumb .x');
    if (x){ const th = x.closest('[data-th]'); removeFile(th.dataset.th, x.closest('.thumb').dataset.id); haptic(); }
  });
  form.addEventListener('change', e => {
    const id = e.target.dataset.file; if (!id) return;
    addFiles(id, [...e.target.files]); e.target.value = '';
  });
  const fieldOf = id => S.form.fields.find(f => f.id === id);

  /* ---------- Wheel picker ---------- */
  const IH = 52, wheel = $('wheel');
  let wItems = [], wIdx = 0, raf = 0, pickCb = null;
  function openPick(id){
    const f = fieldOf(id); if (!f) return;
    let items;
    if (f.type === 'store'){
      if (!S.stores.length){ toast('กำลังโหลดรายชื่อสาขา…'); return; }
      items = S.stores.map(s => ({ v: s.id, main: s.id, sub: s.name }));
    } else items = (f.options || []).map(o => ({ v: o, main: o }));
    $('sheetTitle').textContent = f.label;
    wheel.innerHTML = '<div class="sp"></div>' + items.map((it, i) =>
      `<div class="wi" data-i="${i}"><b>${esc(it.main)}</b>${it.sub ? `<span>${esc(it.sub)}</span>` : ''}</div>`).join('') + '<div class="sp"></div>';
    wItems = [...wheel.querySelectorAll('.wi')];
    wIdx = Math.max(0, items.findIndex(it => it.v === S.vals[id]));
    pickCb = i => {
      S.vals[id] = items[i].v;
      if (f.remember) ls.set('rem_' + id, items[i].v);
      const old = $('fld_' + id), tmp = document.createElement('div');
      tmp.innerHTML = fieldHtml(f); old.replaceWith(tmp.firstElementChild);
    };
    $('scrim').classList.add('show'); $('sheet').classList.add('show');
    requestAnimationFrame(() => { wheel.scrollTop = wIdx * IH; paint(); });
  }
  function paint(){
    raf = 0;
    const c = wheel.scrollTop / IH;
    wItems.forEach((el, i) => {
      const d = i - c, a = Math.abs(d);
      el.style.transform = `perspective(600px) rotateX(${(-d*20).toFixed(1)}deg) scale(${(1 - Math.min(a,3)*.05).toFixed(3)})`;
      el.style.opacity = Math.max(.15, 1 - a*.3).toFixed(2);
      el.classList.toggle('on', a < .5);
    });
    const n = Math.round(c);
    if (n !== wIdx && n >= 0 && n < wItems.length){ wIdx = n; haptic(); }
  }
  wheel.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(paint); }, { passive: true });
  wheel.addEventListener('click', e => {
    const it = e.target.closest('.wi');
    if (it) wheel.scrollTo({ top: +it.dataset.i * IH, behavior: 'smooth' });
  });
  function closeSheet(){
    $('scrim').classList.remove('show');
    const sh = $('sheet'); sh.style.transform = ''; sh.classList.remove('show');
  }
  $('scrim').onclick = closeSheet;
  $('cancelSheet').onclick = closeSheet;
  $('doneSheet').onclick = () => {
    if (!wItems.length) return closeSheet();
    const i = Math.min(wItems.length - 1, Math.max(0, Math.round(wheel.scrollTop / IH)));
    pickCb && pickCb(i); closeSheet(); haptic();
  };
  (() => {
    const sh = $('sheet'), h = $('sheetDrag'); let y0 = null, dy = 0;
    h.addEventListener('pointerdown', e => {
      if (e.target.closest('button')) return;
      y0 = e.clientY; dy = 0; sh.classList.add('drag'); h.setPointerCapture(e.pointerId);
    });
    h.addEventListener('pointermove', e => {
      if (y0 == null) return;
      dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`;
    });
    const end = () => {
      if (y0 == null) return; y0 = null; sh.classList.remove('drag');
      if (dy > 90) closeSheet(); else sh.style.transform = '';
    };
    h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
  })();

  /* ---------- Files ---------- */
  function compress(file, max = 1800, q = .82){
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * s), h = Math.round(img.height * s);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        const data = c.toDataURL('image/jpeg', q);
        res({ type: 'image/jpeg', data: data.split(',')[1], preview: data });
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('อ่านรูปไม่ได้ ลองเลือกรูปอื่น')); };
      img.src = url;
    });
  }
  function readPdf(file){
    return new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res({ type: 'application/pdf', data: String(fr.result).split(',')[1], preview: null });
      fr.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้'));
      fr.readAsDataURL(file);
    });
  }
  function prep(file, f){
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)){
      if (!f.pdf) return Promise.reject(new Error('ช่องนี้รับเฉพาะรูปภาพ'));
      if (file.size > 15e6) return Promise.reject(new Error('PDF ใหญ่เกิน 15MB'));
      return readPdf(file);
    }
    return compress(file);
  }
  let uid = 0;
  async function addFiles(id, files){
    const f = fieldOf(id); if (!f) return;
    if (!f.multiple) files = files.slice(0, 1);
    for (const file of files){
      const item = { id: ++uid, loading: true };
      if (f.multiple) S.files[id].push(item); else S.files[id] = [item];
      renderThumbs(id);
      try { Object.assign(item, await prep(file, f), { loading: false }); }
      catch(e){ toast(e.message, true); removeFile(id, item.id); continue; }
      renderThumbs(id);
    }
  }
  function removeFile(id, itemId){
    S.files[id] = (S.files[id] || []).filter(i => i.id != itemId);
    renderThumbs(id);
  }
  function renderThumbs(id){
    const g = $('th_' + id); if (!g) return;
    const f = fieldOf(id), list = S.files[id] || [], ids = new Set(list.map(i => String(i.id)));
    [...g.children].forEach(el => {
      if (!ids.has(el.dataset.id) && !el.classList.contains('out')){
        el.classList.add('out'); setTimeout(() => el.remove(), 300);
      }
    });
    list.forEach(it => {
      let el = g.querySelector(`[data-id="${it.id}"]`);
      if (!el){ el = document.createElement('div'); el.className = 'thumb'; el.dataset.id = it.id; g.appendChild(el); }
      const st = it.loading ? 'l' : 'd';
      if (el.dataset.st !== st){
        el.dataset.st = st;
        el.innerHTML = (it.loading ? '<div class="busy"><div class="spin"></div></div>'
          : it.preview ? `<img src="${it.preview}" alt="">` : '<div class="pdf">PDF</div>')
          + '<button class="x" type="button" aria-label="ลบ">×</button>';
      }
    });
    $('cnt_' + id).textContent = list.length ? list.length + ' ไฟล์' : (f.hint || '');
    $('ub_' + id).textContent = (!f.multiple && list.length ? 'เปลี่ยน' : 'เพิ่ม') + f.label;
  }

  /* ---------- Submit ---------- */
  let pTimer, pv = 0;
  function setP(v){
    const b = $('pBar'), t = $('pPct'); if (!b) return;
    b.style.strokeDashoffset = 213.6 * (1 - v); t.textContent = Math.round(v * 100) + '%';
  }
  function showProgress(){
    pv = 0;
    $('hud').innerHTML = `<div class="ringbox"><svg class="ring" viewBox="0 0 80 80"><circle class="trk" cx="40" cy="40" r="34"/><circle class="bar" id="pBar" cx="40" cy="40" r="34"/></svg><div class="pct" id="pPct">0%</div></div><h3 id="pTxt" style="font-size:18px;margin:0">กำลังอัปโหลดไฟล์…</h3><p>อย่าปิดหน้านี้จนกว่าจะเสร็จ</p>`;
    $('overlay').classList.add('show'); $('submitBtn').disabled = true;
    pTimer = setInterval(() => {
      pv += (0.93 - pv) * 0.05; setP(pv);
      if (pv > .6) $('pTxt').textContent = 'กำลังบันทึกลง Drive…';
    }, 200);
  }
  function hideOverlay(){ clearInterval(pTimer); $('overlay').classList.remove('show'); const b = $('submitBtn'); if (b) b.disabled = false; }

  function showDone(time){
    clearInterval(pTimer); setP(1);
    const F = S.form, st = F.fields.find(f => f.type === 'store');
    const cells = [];
    if (st) cells.push([st.label, S.vals[st.id]]);
    F.fields.filter(f => f.type !== 'store' && f.type !== 'files' && S.vals[f.id]).slice(0, 2)
      .forEach(f => cells.push([f.label, S.vals[f.id]]));
    const n = F.fields.filter(f => f.type === 'files').reduce((a, f) => a + S.files[f.id].length, 0);
    cells.push(['ไฟล์แนบ', n + ' ไฟล์']);
    setTimeout(() => {
      $('hud').innerHTML = `<svg class="check" viewBox="0 0 80 80"><circle cx="40" cy="40" r="36"/><path d="M25 41l10 10 21-22"/></svg>
        <h3>ส่งงานสำเร็จ</h3><p>${esc(time || '')}</p>
        <div class="sum">${cells.map(c => `<div><span>${esc(c[0])}</span><b>${esc(c[1])}</b></div>`).join('')}</div>
        <button class="btn btn-y" id="againBtn" type="button">ส่งงานใหม่</button>
        <a class="btn btn-g" href="report.html">ดูรายงาน</a>`;
      $('againBtn').onclick = resetForm;
      haptic();
    }, 350);
  }
  function resetForm(){
    S.form.fields.forEach(f => {
      if (f.type === 'files') S.files[f.id] = [];
      else if (!f.remember && f.type !== 'store') delete S.vals[f.id];
    });
    hideOverlay(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function submit(){
    const F = S.form;
    for (const f of F.fields){
      const empty = f.type === 'files' ? !S.files[f.id].length : !String(S.vals[f.id] || '').trim();
      if (f.required && empty){
        const el = $('fld_' + f.id); shake(el);
        toast((f.type === 'files' ? 'กรุณาแนบ ' : f.type === 'store' || f.type === 'select' ? 'กรุณาเลือก ' : 'กรุณากรอก ') + f.label, true);
        el.scrollIntoView({ behavior: 'smooth', block: 'center' }); return;
      }
    }
    if (F.fields.some(f => f.type === 'files' && S.files[f.id].some(i => i.loading))){ toast('รอประมวลผลรูปสักครู่…'); return; }
    if (!/^https:\/\/script\.google\.com\//.test(CFG.API_URL || '')){ toast('ยังไม่ได้ใส่ API_URL ใน config.js', true); return; }

    const answers = {}, files = {};
    F.fields.forEach(f => {
      if (f.type === 'files') files[f.id] = S.files[f.id].map(i => ({ type: i.type, data: i.data }));
      else {
        answers[f.id] = String(S.vals[f.id] || '').trim();
        if (f.remember && answers[f.id]) ls.set('rem_' + f.id, answers[f.id]);
      }
    });
    showProgress();
    try {
      const r = await fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify({ action: 'submit', answers, files }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'บันทึกไม่สำเร็จ');
      showDone(j.time);
    } catch(e){
      hideOverlay();
      toast(e.message && !/fetch|network|json/i.test(e.message) ? e.message : 'ส่งไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่', true);
    }
  }

  init();
})();
</script>
</body>
</html>
